# pi-setup module manifest
#
# Each module is an independent git repo with its own ./install.sh.
# pi-setup clones/updates them under ~/local_code and runs their installers.
#
# tier:
#   required    — installed always
#   recommended — installed unless --minimal
#   optional    — installed only with --with-<name>
#
# ref: branch, tag, or SHA to check out. Pin tags/SHAs for reproducible
# installs; "main" advances only with --update. Existing origins must match
# repo exactly. Local modifications and non-fast-forward updates stop installs.

version: 1

modules:
  pi-shared:
    repo: https://github.com/GeorgeTheo99/pi-shared.git
    ref: main
    tier: required
    description: >-
      Shared Pi coding-agent resources: extensions (memory, subagents,
      browser automation, deep research, work plans, tool bundles), skills,
      prompts, themes, and workflows. Registers itself as a Pi package.

  model-gateway:
    repo: https://github.com/GeorgeTheo99/model-gateway.git
    ref: main
    tier: recommended
    description: >-
      Self-hosted model router on 127.0.0.1:9111 — one local endpoint for
      cloud providers (bring your own keys) and local oMLX MLX models,
      speaking OpenAI Chat/Responses and Anthropic protocols. Skip it
      (--minimal) if you configure Pi providers directly.
    post_install_note: >-
      The installer bootstraps a starter catalog and empty provider config.
      Onboard a provider/model before expecting inference; /health is only
      liveness. See README.md and docs/provider-onboarding.md in the module.

  browser-worker:
    repo: https://github.com/GeorgeTheo99/browser-worker.git
    ref: 3416717d1e69a279e74846091a04f29c4200f2ef
    tier: recommended
    description: >-
      Local rendered-browser MCP on 127.0.0.1:8890. Installs its locked Python
      environment, Chromium and a per-user production token. Supplies
      browser_fetch/browser_inspect independently of web_search/web_fetch.

  local_web_search:
    repo: https://github.com/GeorgeTheo99/local_web_search.git
    ref: main
    tier: optional
    description: >-
      Loopback-only web search + page retrieval broker on 127.0.0.1:8889
      (FastMCP + Brave Search). Powers pi-shared's web_search / web_fetch /
      deep_research tools. Requires a personal Brave Search API key.
    post_install_note: >-
      BEFORE installing: pre-clone this module and create its owner-only
      data/brave_key (mode 0600, data directory 0700), or use its documented
      custom data directory. See the module README; the installer starts
      the service and fails if its required credential is absent or unsafe.
